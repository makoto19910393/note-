name: 朝と夜のnote原稿

on:
  schedule:
    # UTC 22:00 = Japan 07:00; UTC 10:00 = Japan 19:00.
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 作成する時間枠
        type: choice
        default: auto
        options: [auto, morning, evening]
      mode:
        description: autoは設定に従う、draftは下書き保存（ユーザー確認期間中は公開しません）
        type: choice
        default: auto
        options: [auto, disabled, draft, publish]
      run_id:
        description: 既存原稿ID（複数はカンマ区切り・最大6件。新規作成しない）
        type: string
        required: false
      verify_only:
        description: 再投稿せず既存記事の公開状態だけを確認
        type: boolean
        default: false
      inspect_editor:
        description: 既存記事の編集操作名のみ確認
        type: boolean
        default: false

      withdraw_duplicate:
        description: 誤って重複公開したNo.2だけを下書きへ戻す
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: note-drafts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      NOTE_USAGE_DIR: content/usage
      REQUESTED_NOTE_MODE: ${{ github.event.inputs.mode || vars.NOTE_MODE || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 保存処理と失敗時の挙動を確認
        run: python -m unittest discover -s tests -v
      - name: 実行する投稿モードを決定
        id: settings
        run: |
          python - <<'PY'
          import json, os
          mode = os.environ['REQUESTED_NOTE_MODE']
          if mode == 'auto':
              mode = json.load(open('config.json'))['publisher'].get('mode', 'disabled')
          if json.load(open('config.json'))['publisher'].get('manual_first_publication') and mode == 'publish':
              mode = 'draft'
          if mode not in ('disabled', 'draft', 'publish'):
              raise SystemExit('Invalid note mode')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('mode=' + mode + '\n')
          print('note mode:', mode)
          PY
      - name: 投稿処理の依存関係を導入
        if: steps.settings.outputs.mode == 'draft' || steps.settings.outputs.mode == 'publish'
        run: |
          python -m pip install -r requirements-publish.txt
          python -m playwright install --with-deps chromium
      - name: 最新AIニュースを調べて執筆・noteへ下書き保存
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.NOTE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          RUN_SLOT: ${{ github.event.inputs.slot || 'auto' }}
          NOTE_MODE: ${{ steps.settings.outputs.mode }}
          NOTE_UI_VERIFIED: ${{ vars.NOTE_UI_VERIFIED }}
          NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL || secrets.MAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_HEADLESS: 'false'
          EXISTING_RUN_ID: ${{ github.event.inputs.run_id }}
          VERIFY_PUBLIC_ONLY: ${{ github.event.inputs.verify_only || 'false' }}
          WITHDRAW_DUPLICATE: ${{ github.event.inputs.withdraw_duplicate || 'false' }}
          INSPECT_EDITOR_ONLY: ${{ github.event.inputs.inspect_editor || 'false' }}
        run: |
          if [ "$WITHDRAW_DUPLICATE" = "true" ]; then
            xvfb-run -a python publisher.py --run-id "$EXISTING_RUN_ID" --withdraw-duplicate
          elif [ "$INSPECT_EDITOR_ONLY" = "true" ]; then
            xvfb-run -a python publisher.py --run-id "$EXISTING_RUN_ID" --inspect-editor
          elif [ "$VERIFY_PUBLIC_ONLY" = "true" ]; then
            xvfb-run -a python publisher.py --run-id "$EXISTING_RUN_ID" --verify-only
          elif [ -n "$EXISTING_RUN_ID" ]; then
            xvfb-run -a python run_workflow.py --run-id "$EXISTING_RUN_ID"
          else
            xvfb-run -a python run_workflow.py --slot "$RUN_SLOT"
          fi
      - name: 原稿をGitHubに保存
        if: always()
        run: |
          git add content/
          if ! git diff --cached --quiet; then
            git config user.name 'note-draft-bot'
            git config user.email 'note-draft-bot@users.noreply.github.com'
            git commit -m '朝・夜のnote原稿を保存'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 原稿をダウンロードできる形で保管
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-drafts-${{ github.run_id }}
          path: content/
          retention-days: 7
      - name: 改稿前の下書きを暗号化して保管
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-drafts-encrypted-${{ github.run_id }}
          path: /tmp/draft-revision-backup/
          if-no-files-found: ignore
          retention-days: 7
