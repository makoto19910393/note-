name: note接続画面の確認
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-publish.txt
          python -m playwright install --with-deps chromium
      - name: 認証情報を使わず公開ログイン画面を確認
        run: python browser_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-note-ui
          path: browser-check/
          retention-days: 3
