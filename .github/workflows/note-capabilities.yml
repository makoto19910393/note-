name: note画像APIの接続確認
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.NOTE }}
        run: python scripts/check_image_capabilities.py
