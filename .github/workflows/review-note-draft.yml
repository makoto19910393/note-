name: 画像付きニュース下書きを準備
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: note-editorial-review
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ブラウザを準備
        run: |
          python -m pip install -r requirements-publish.txt
          python -m playwright install --with-deps chromium
      - name: 下書きを準備（公開ボタンは押さない）
        env:
          NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
        run: xvfb-run -a python drafts/2026-10-11/gemini-agent/review_draft.py
      - name: 下書きIDを保全
        if: always()
        run: |
          git config user.name 'note automation'
          git config user.email 'note-automation@users.noreply.github.com'
          if [ -f drafts/2026-10-11/gemini-agent/note-draft.json ]; then
            git add drafts/2026-10-11/gemini-agent/note-draft.json
            if ! git diff --cached --quiet; then
              git commit -m 'Preserve separate editorial review draft'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-editor-screenshot
          path: /tmp/review-editor.png
          retention-days: 1
