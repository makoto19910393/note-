name: noteの読者実績を非公開で調査
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: 調査資料を暗号化する公開鍵
        type: string
        required: true
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ブラウザを準備
        run: |
          python -m pip install -r requirements-publish.txt
          python -m playwright install --with-deps chromium
      - name: アクセス状況を読む（設定や記事は変更しない）
        env:
          NOTE_STORAGE_STATE: ${{ secrets.NOTE_STORAGE_STATE }}
          RESEARCH_PUBLIC_KEY: ${{ github.event.inputs.public_key }}
        run: xvfb-run -a python research_dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: private-note-dashboard-encrypted
          path: /tmp/private-note-dashboard/
          retention-days: 1
